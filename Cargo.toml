[package]
name = "groq-memory-system"
version = "1.4.0"
edition = "2021"
authors = ["Aashu <mishra-aashu>"]
description = "Aashu AI - Hands-Free Voice Assistant with Vector Memory"

[lib]
name = "aashu_backend"
path = "src/lib.rs"

[[bin]]
name = "groq-memory-system"
path = "src/main.rs"

[package.metadata.deb]
name = "aashu-ai"
maintainer = "Aashu <mishra-aashu>"
copyright = "2026 Aashu"
extended-description = "Aashu AI is a hands-free personal assistant with long-term vector memory, custom wake-words, and multi-language support."
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/groq-memory-system", "usr/bin/groq-memory-system", "755"],
    ["start-app.sh", "usr/bin/aashu-ai", "755"],
    ["public/*", "usr/share/aashu-ai/public/", "644"],
    ["Aashu.desktop", "usr/share/applications/aashu-ai.desktop", "644"],
]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
