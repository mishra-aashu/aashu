<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.2)" stroke-width="6" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8" />

  <!-- Central Brain / Circuit Icon -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Left Brain Hemisphere -->
    <path d="M 150 70 C 110 70, 70 100, 70 150 C 70 180, 85 205, 105 220 C 85 235, 75 260, 75 285 C 75 325, 105 350, 150 350 C 150 250, 150 170, 150 70 Z" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Brain Hemisphere -->
    <path d="M 150 70 C 190 70, 230 100, 230 150 C 230 180, 215 205, 195 220 C 215 235, 225 260, 225 285 C 225 325, 195 350, 150 350 C 150 250, 150 170, 150 70 Z" 
          fill="none" stroke="url(#pinkGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neural Nodes -->
    <circle cx="110" cy="140" r="10" fill="#00f2fe" />
    <circle cx="190" cy="140" r="10" fill="#ff0844" />
    <circle cx="150" cy="210" r="12" fill="#ffffff" />
    <circle cx="95" stroke-width="3" cy="270" r="9" fill="#00f2fe" />
    <circle cx="205" stroke-width="3" cy="270" r="9" fill="#ff0844" />

    <!-- Connecting Circuit Lines -->
    <line x1="110" y1="140" x2="150" y2="210" stroke="url(#cyanGrad)" stroke-width="6" />
    <line x1="190" y1="140" x2="150" y2="210" stroke="url(#pinkGrad)" stroke-width="6" />
    <line x1="150" y1="210" x2="95" y2="270" stroke="url(#cyanGrad)" stroke-width="6" />
    <line x1="150" y1="210" x2="205" y2="270" stroke="url(#pinkGrad)" stroke-width="6" />

    <!-- Audio Waveforms overlay at bottom -->
    <line x1="60" y1="210" x2="60" y2="210" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" />
    <line x1="240" y1="210" x2="240" y2="210" stroke="#ff0844" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
