name: Build & Release Aashu AI Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Standalone Rust Binary
        run: cargo build --release

      - name: Prepare Release Bundle Directory
        run: |
          mkdir -p dist/bin
          cp target/release/groq-memory-system dist/bin/
          cp -r public dist/
          cp start-app.sh dist/
          cp install.sh dist/
          cp Aashu.desktop dist/
          cp .env.example dist/.env
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            sed -i 's|GROQ_API_KEY=.*|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|g' dist/.env
          fi
          chmod +x dist/start-app.sh dist/install.sh dist/bin/groq-memory-system

          cd dist
          tar -czvf ../aashu-ai-linux-x86_64.tar.gz *

      - name: Install cargo-deb tool
        run: cargo install cargo-deb

      - name: Build Debian (.deb) Package
        run: |
          cargo deb
          cp target/debian/*.deb aashu-ai-linux_amd64.deb

      - name: Upload Build Artifact (for commits)
        uses: actions/upload-artifact@v4
        with:
          name: aashu-ai-linux-packages
          path: |
            aashu-ai-linux-x86_64.tar.gz
            aashu-ai-linux_amd64.deb

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aashu-ai-linux-x86_64.tar.gz
            aashu-ai-linux_amd64.deb
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
